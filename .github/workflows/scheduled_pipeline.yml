name: RoleRadar Scheduled Pipeline

on:
  schedule:
    # Every 4 hours. GitHub Actions cron is UTC and best-effort - the
    # actual run can be delayed up to ~10-15 minutes during high load
    # on GitHub's shared runners. Fine for a "every ~4 hours" job.
    # - cron: "0 */4 * * *" # to run every 4hrs 
    - cron: "31 2 * * *" # every day at 2:31 AM UTC = 8:01 AM IST.

  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run scheduled pipeline
        working-directory: backend
        env:
          PYTHONPATH: ..
          GROQ_API_KEY_FOR_JD_PARSING: ${{ secrets.GROQ_API_KEY_FOR_JD_PARSING }}
          GROQ_API_KEY_FOR_SEMANTIC_MATCHING: ${{ secrets.GROQ_API_KEY_FOR_SEMANTIC_MATCHING }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GEMINI_API_KEY_FOR_TAILORING: ${{ secrets.GEMINI_API_KEY_FOR_TAILORING }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          # certs/isrgrootx1.pem is already committed to the repo (it's a
          # public root CA cert, not sensitive) - this path is relative
          # to the "backend" working-directory set above.
          TIDB_CA: certs/isrgrootx1.pem
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          WEBSITE_BASE_URL: ${{ secrets.WEBSITE_BASE_URL }}
        run: python -m maintenance.scheduled_run